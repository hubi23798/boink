services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "corepack enable &&
             corepack prepare pnpm@9.15.0 --activate &&
             pnpm install &&
             pnpm db:migrate &&
             pnpm dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - pnpm_store:/root/.local/share/pnpm/store
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      # Supabase local stack runs on the host machine.
      # macOS/Windows: host.docker.internal resolves to the host.
      # Linux: add --add-host=host.docker.internal:host-gateway to docker run,
      #        or replace host.docker.internal with the host's LAN IP.
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      SUPABASE_DB_DIRECT_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@truffe.ai}
      RP_ID: localhost
      RP_NAME: truffe.ai
      ORIGIN: http://localhost:3000
      NODE_ENV: development
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODEL_ADVISOR: ${MODEL_ADVISOR:-claude-sonnet-4-6}
      ADVISOR_DAILY_TOKEN_BUDGET: ${ADVISOR_DAILY_TOKEN_BUDGET:-200000}
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret-1}

volumes:
  pnpm_store:
  node_modules:
  next_cache:
